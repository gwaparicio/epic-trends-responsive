<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7eff2" />
    <meta name="description" content="EPIC trends — commercial furniture representation across Southern California and Hawaii." />
    <meta property="og:title" content="EPIC trends — Inspired by design." />
    <meta property="og:description" content="Commercial furniture, materials, and solutions for Southern California and Hawaii." />
    <meta property="og:type" content="website" />
    <title>EPIC trends — Inspired by design.</title>
  </head>
  <body>
    <!-- Netlify form discovery: mirrors the React showroom appointment form for deployment-time detection. -->
    <form name="showroom-appointment" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="showroom-appointment" />
      <input name="first-name" />
      <input name="last-name" />
      <input name="company" />
      <input name="title" />
      <input name="email" />
      <input name="phone" />
      <input name="tour-type" />
      <input name="preferred-date" />
      <input name="preferred-time" />
      <input name="interest" />
      <textarea name="project-interest"></textarea>
      <input name="contact-consent" />
      <input name="lead-source" />
      <input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
